# ==============================================================================
# ReconX Render Blueprint (Infrastructure-as-Code)
# Auto-syncs both Frontend and Backend from your GitHub repository on Render.com
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. ReconX Backend API (FastAPI + Python 3.11)
  # ----------------------------------------------------------------------------
  - type: web
    name: reconx-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: reconx_session
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: NVD_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ALLOWED_ORIGINS
        value: "https://reconx-frontend.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. ReconX Web Dashboard (Next.js 16 + Node 20)
  # ----------------------------------------------------------------------------
  - type: web
    name: reconx-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: "https://reconx-backend.onrender.com/api/v1"
