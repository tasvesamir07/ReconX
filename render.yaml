# ==============================================================================
# ReconX Render Blueprint (Infrastructure-as-Code)
# Auto-syncs both Frontend and Backend from your GitHub repository on Render.com
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. ReconX Backend API (FastAPI + Python 3.11)
  # ----------------------------------------------------------------------------
  - type: web
    name: reconx-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && bash scripts/install_scanner_tools.sh || true
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: reconx_session
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ALLOWED_HOSTS
        value: "reconx-backend-ljsn.onrender.com,reconx-backend.onrender.com"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: NVD_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CORS_ALLOWED_ORIGINS
        value: "https://reconx-frontend.onrender.com,https://reconx-frontend-wyrk.onrender.com"
      # Set these only after creating a Cloudflare Turnstile site.
      - key: CAPTCHA_ENABLED
        value: "false"
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. ReconX Web Dashboard (Next.js 16 + Node 20)
  # ----------------------------------------------------------------------------
  - type: web
    name: reconx-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # The browser talks to the Next.js origin; Next proxies /api/v1 to the
      # backend. This keeps the session cookie first-party (SameSite=Lax).
      - key: API_PROXY_TARGET
        value: "https://reconx-backend-ljsn.onrender.com"
      - key: NEXT_PUBLIC_API_URL
        value: "https://reconx-backend-ljsn.onrender.com/api/v1"
      # Demo shortcut buttons enabled for instant testing.
      - key: NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS
        value: "true"
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
