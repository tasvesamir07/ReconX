services:
  db:
    image: postgres:16-alpine
    container_name: reconx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconx_secure_pass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-reconx}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reconx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reconx_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reconx_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:-reconx-production-secret-encryption-key-change-me-2026!}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-reconx_secure_pass_2026!}@db:5432/${POSTGRES_DB:-reconx}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SESSION_COOKIE_NAME: reconx_session
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_IDLE_TIMEOUT_MINUTES: 120
      SESSION_ABSOLUTE_TIMEOUT_HOURS: 24
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WORKER_MAX_CONCURRENCY: 3
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    networks:
      - reconx_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: reconx_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    networks:
      - reconx_net

volumes:
  postgres_data:
  backend_storage:

networks:
  reconx_net:
    driver: bridge
